name: Tests

on: push

jobs:
  # El nombre del job es launch-test
  launch-tests:
    runs-on: ubuntu-latest
    # Todos los pasos se ejecutan en el contenedor eclipse-temurin:8-jdk-alpine
    container: eclipse-temurin:8-jdk-alpine

    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Permisos de mvnw
        run: chmod +x mvnw
      - name: Launch tests with Maven
        run: ./mvnw test