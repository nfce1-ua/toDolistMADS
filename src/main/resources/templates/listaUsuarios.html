<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Usuarios registrados')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
  <div class="row mt-3">
    <div class="col">
      <h2>Listado de usuarios</h2>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col">
      <table class="table table-striped">
        <thead>
        <tr>
          <th>Id</th>
          <th>Email</th>
          <th>Estado</th>
          <th>Acción</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.id}"></td>
          <td th:text="${u.email}"></td>
          <td th:text="${u.bloqueado} ? 'bloqueado' : 'activo'"></td>
          <td>
            <a class="btn btn-primary btn-xs" th:href="@{/registrados/{id}(id=${u.id})}">descripción</a>
            <form th:if="${!u.administrador}"
                  th:action="@{/registrados/{id}/bloqueo(id=${u.id})}"
                  method="post" style="display:inline">
              <button type="submit" class="btn btn-xs"
                      th:classappend="${u.bloqueado} ? 'btn-success' : 'btn-warning'"
                      th:text="${u.bloqueado} ? 'Habilitar' : 'Bloquear'"></button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div th:replace="fragments::javascript"/>
</body>
</html>
