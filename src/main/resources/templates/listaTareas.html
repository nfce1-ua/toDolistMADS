<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" th:href="@{/about}">ToDoList</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse"
            data-target="#menuPrincipal" aria-controls="menuPrincipal"
            aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
        <!-- Usuario logeado -->
        <ul class="navbar-nav mr-auto" th:if="${usuarioLogeado != null}">
            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/usuarios/{id}/tareas(id=${usuarioLogeado.id})}">Tareas</a>
            </li>
        </ul>
        <ul class="navbar-nav ml-auto" th:if="${usuarioLogeado != null}">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="menuUsuario"
                   data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                   th:text="${usuarioLogeado.nombre != null ? usuarioLogeado.nombre : usuarioLogeado.email}"></a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="menuUsuario">
                    <a class="dropdown-item" href="#">Cuenta</a>
                    <a class="dropdown-item" th:href="@{/logout}"
                       th:text="'Cerrar sesión ' + ${usuarioLogeado.nombre != null ? usuarioLogeado.nombre : usuarioLogeado.email}"></a>
                </div>
            </li>
        </ul>

        <!-- Usuario no logeado (solo se verá en /about) -->
        <ul class="navbar-nav ml-auto" th:if="${usuarioLogeado == null}">
            <li class="nav-item"><a class="nav-link" th:href="@{/login}">Iniciar sesión</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/registro}">Registrarse</a></li>
        </ul>
    </div>
</nav>

<head th:replace="fragments :: head (titulo='Login')"></head>

<body>
<div class="container-fluid">

    <div class="row mt-3">
        <div class="col">
            <h2 th:text="'Listado de tareas de ' + ${usuario.nombre}"></h2>
        </div>
    </div>

    <div class="row mt-3">
        <div class="col">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Id</th>
                    <th>Tarea</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tarea: ${tareas}">
                    <td th:text="${tarea.id}"></td>
                    <td th:text="${tarea.titulo}"></td>
                    <td><a class="btn btn-primary btn-xs" th:href="@{/tareas/{id}/editar(id=${tarea.id})}"/>editar</a>
                        <button class="btn btn-danger btn-xs" onmouseover="" style="cursor: pointer;"
                           th:onclick="'del(\'/tareas/' + ${tarea.id} + '\')'">borrar</button>
                    </td>
                </tr>
                </tbody>
            </table>
            <p><a class="btn btn-primary" th:href="@{/usuarios/{id}/tareas/nueva(id=${usuario.id})}"> Nueva tarea</a>
            <a class="btn btn-link" href="/logout">Salir</a></p>
        </div>
    </div>
    <div class="row mt-2">
        <div class="col">
            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${!#strings.isEmpty(mensaje)}">
                <span th:text="${mensaje}"></span>
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </div>
    </div>
</div>


</div>

<div th:replace="fragments::javascript"/>

<!-- Lanzamos una petición DELETE por JavaScript para borrar una tarea -->

<script type="text/javascript">
    function del(urlBorrar) {
        if (confirm('¿Estás seguro/a de que quieres borrar la tarea?')) {
            fetch(urlBorrar, {
                method: 'DELETE'
            }).then((res) => location.reload());
        }
    }
</script>

</body>
</html>
