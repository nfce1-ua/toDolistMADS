<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head (titulo)">
    <meta charset="UTF-8"/>
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<div th:fragment="javascript">
    <script th:src="@{/js/jquery.min.js}"></script>
    <script th:src="@{/js/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap.min.js}"></script>
</div>

<nav th:fragment="navbar" class="navbar navbar-expand-md navbar-light bg-light">
    <button class="navbar-toggler" type="button" data-toggle="collapse"
            data-target="#menuPrincipal" aria-controls="menuPrincipal"
            aria-expanded="false" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menuPrincipal">
        <!-- Lado izquierdo -->
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" th:href="@{/about}">ToDoList</a>
            </li>
            <li class="nav-item" th:if="${usuarioLogeado != null}">
                <a class="nav-link"
                   th:href="@{/usuarios/{id}/tareas(id=${usuarioLogeado.id})}">Tareas</a>
            </li>
        </ul>

        <!-- Lado derecho: usuario logeado -->
        <ul class="navbar-nav ml-auto" th:if="${usuarioLogeado != null}">
            <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" href="#" id="menuUsuario"
                   data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"
                   th:text="${usuarioLogeado.nombre != null ? usuarioLogeado.nombre : usuarioLogeado.email}"></a>
                <div class="dropdown-menu dropdown-menu-right" aria-labelledby="menuUsuario">
                    <a class="dropdown-item" href="#">Cuenta</a>
                    <a class="dropdown-item" th:href="@{/logout}"
                       th:text="'Cerrar sesión ' + ${usuarioLogeado.nombre != null ? usuarioLogeado.nombre : usuarioLogeado.email}"></a>
                </div>
            </li>
        </ul>

        <!-- Lado derecho: usuario no logeado (solo se verá en /about) -->
        <ul class="navbar-nav ml-auto" th:if="${usuarioLogeado == null}">
            <li class="nav-item"><a class="nav-link" th:href="@{/login}">Iniciar sesión</a></li>
            <li class="nav-item"><a class="nav-link" th:href="@{/registro}">Registrarse</a></li>
        </ul>
    </div>
</nav>

</html>
