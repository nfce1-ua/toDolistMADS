<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Editar equipo')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
  <div class="row mt-3">
    <div class="col"><h2>Editar equipo</h2></div>
  </div>
  <div class="row mt-3">
    <div class="col-6">
      <div class="alert alert-danger" th:if="${!#strings.isEmpty(error)}" th:text="${error}"></div>
      <form method="post" th:action="@{/equipos/{id}/editar(id=${equipo.id})}">
        <div class="form-group">
          <label for="nombre">Nombre del equipo</label>
          <input class="form-control" id="nombre" name="nombre" type="text"
                 th:value="${equipo.nombre}"/>
        </div>
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-link" th:href="@{/equipos/{id}(id=${equipo.id})}">Cancelar</a>
      </form>
    </div>
  </div>
</div>
<div th:replace="fragments::javascript"/>
</body>
</html>
