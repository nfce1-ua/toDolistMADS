<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipos')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
  <div class="row mt-3">
    <div class="col"><h2>Listado de equipos</h2></div>
  </div>
  <div class="row mt-3">
    <div class="col">
      <table class="table table-striped">
        <thead>
        <tr><th>Id</th><th>Nombre</th></tr>
        </thead>
        <tbody>
        <tr th:each="e : ${equipos}">
          <td th:text="${e.id}"></td>
          <td><a th:href="@{/equipos/{id}(id=${e.id})}" th:text="${e.nombre}"></a></td>
        </tr>
        </tbody>
      </table>
      <div class="row mt-2">
        <div class="col">
          <div class="alert alert-success" th:if="${!#strings.isEmpty(mensaje)}" th:text="${mensaje}"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div th:replace="fragments::javascript"/>
</body>
</html>
