<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments :: head (titulo='Equipo')"></head>

<body>
<div th:replace="fragments :: navbar"></div>
<div class="container-fluid">
  <div class="row mt-3">
    <div class="col"><h2 th:text="'Equipo ' + ${equipo.nombre}"></h2></div>
    <div class="alert alert-success" th:if="${!#strings.isEmpty(mensaje)}" th:text="${mensaje}"></div>
    <div class="alert alert-danger" th:if="${!#strings.isEmpty(error)}" th:text="${error}"></div>

    <form th:if="${!pertenece}" method="post" th:action="@{/equipos/{id}/unirse(id=${equipo.id})}">
      <button type="submit" class="btn btn-success">Unirme</button>
    </form>
    <form th:if="${pertenece}" method="post" th:action="@{/equipos/{id}/salir(id=${equipo.id})}">
      <button type="submit" class="btn btn-warning">Salir</button>
    </form>
    <div th:if="${usuarioLogeado != null and usuarioLogeado.administrador}" class="mt-2">
      <a class="btn btn-primary" th:href="@{/equipos/{id}/editar(id=${equipo.id})}">Editar</a>
      <form method="post" th:action="@{/equipos/{id}/eliminar(id=${equipo.id})}"
            style="display:inline"
            onsubmit="return confirm('¿Estás seguro/a de que quieres eliminar el equipo?');">
        <button type="submit" class="btn btn-danger">Eliminar</button>
      </form>
    </div>
  </div>
  <div class="row mt-3">
    <div class="col">
      <table class="table table-striped">
        <thead>
        <tr><th>Id</th><th>Email</th><th>Nombre</th></tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
          <td th:text="${u.id}"></td>
          <td th:text="${u.email}"></td>
          <td th:text="${u.nombre}"></td>
        </tr>
        </tbody>
      </table>
      <a class="btn btn-link" th:href="@{/equipos}">Volver a equipos</a>
    </div>
  </div>
</div>
<div th:replace="fragments::javascript"/>
</body>
</html>
